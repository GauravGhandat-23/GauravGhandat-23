<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <title>Gaurav Ghandat — animated hero</title>
  <defs>
    <linearGradient id="aurora" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151827"/><stop offset="1" stop-color="#0d0e16"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".08"/></pattern>
    <style>
      .bg{fill:#0d0e16} .card{fill:url(#glass);stroke:url(#aurora);stroke-opacity:.55}
      .t{fill:#f8fafc;font-family:Inter,Arial,sans-serif} .m{fill:#cbd5e1;font-family:'JetBrains Mono',Consolas,monospace}
      .cyan{fill:#22d3ee} .muted{fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="520" class="bg"/>
  <rect width="1200" height="520" fill="url(#dots)"/>
  
<rect x="30" y="30" width="1140" height="460" rx="30" class="card"/>
<circle cx="100" cy="95" r="8" fill="#22d3ee"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
<text x="125" y="102" class="m" font-size="20">OPEN TO COLLABS</text>
<text x="70" y="190" class="m" font-size="24">Hi there, I'm</text>
<text x="70" y="255" class="t" font-size="64" font-weight="800" fill="url(#aurora)">Gaurav Ghandat</text>
<rect x="70" y="280" width="560" height="4" rx="2" fill="url(#aurora)">
  <animate attributeName="width" values="20;560" dur="1.5s" fill="freeze"/>
</rect>
<g class="m" font-size="24">
  <text x="70" y="335">SOC Analyst · Blue Team · Splunk SIEM</text>
  <text x="70" y="370" class="muted">Windows Server · Active Directory · Linux · Detection Engineering</text>
</g>
<g transform="translate(70 420)">
  <rect width="210" height="42" rx="21" fill="#111827" stroke="#22d3ee" opacity=".95"/>
  <text x="105" y="28" text-anchor="middle" class="m" font-size="16">Nashik, India</text>
</g>
<g transform="translate(300 420)">
  <rect width="280" height="42" rx="21" fill="#111827" stroke="#a78bfa"/>
  <text x="140" y="28" text-anchor="middle" class="m" font-size="16">Bits &amp; Bytes Services</text>
</g>
<g transform="translate(760 80)">
  <rect width="340" height="320" rx="24" fill="#070a12" stroke="#334155"/>
  <text x="30" y="45" class="m" font-size="15" fill="#22d3ee">SOC_TERMINAL // LIVE</text>
  <text x="30" y="85" class="m" font-size="15">collect → correlate → alert</text>
  <text x="30" y="125" class="m" font-size="15">triage → respond → tune</text>
  <g transform="translate(30 165)">
    <circle cx="18" cy="18" r="10" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="88" cy="18" r="10" fill="#a78bfa" filter="url(#glow)"/>
    <circle cx="158" cy="18" r="10" fill="#f472b6" filter="url(#glow)"/>
    <path d="M28 18H78M98 18H148" stroke="#64748b" stroke-width="3"/>
  </g>
  <text x="30" y="245" class="m" font-size="14" fill="#94a3b8">DETECTIONS: T1110 · T1071 · T1190</text>
  <text x="30" y="278" class="m" font-size="14" fill="#94a3b8">SIEM: SPLUNK ENTERPRISE</text>
</g>

</svg>