<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <title>SOC ID dashboard</title>
  <defs>
    <linearGradient id="aurora" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151827"/><stop offset="1" stop-color="#0d0e16"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".08"/></pattern>
    <style>
      .bg{fill:#0d0e16} .card{fill:url(#glass);stroke:url(#aurora);stroke-opacity:.55}
      .t{fill:#f8fafc;font-family:Inter,Arial,sans-serif} .m{fill:#cbd5e1;font-family:'JetBrains Mono',Consolas,monospace}
      .cyan{fill:#22d3ee} .muted{fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="520" class="bg"/>
  <rect width="1200" height="520" fill="url(#dots)"/>
  
<rect x="30" y="30" width="1140" height="460" rx="30" class="card"/>
<text x="65" y="82" class="t" font-size="30" font-weight="700">🪪 SOC Analyst ID + Dashboard</text>
<g transform="translate(70 120)">
  <rect width="390" height="300" rx="24" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
  <rect x="28" y="30" width="120" height="150" rx="18" fill="#070a12" stroke="#22d3ee"/>
  <circle cx="88" cy="78" r="28" fill="#1e293b"/><rect x="55" y="112" width="66" height="45" rx="20" fill="#1e293b"/>
  <text x="175" y="65" class="m" font-size="16" fill="#22d3ee">GAURAV GHANDAT</text>
  <text x="175" y="98" class="m" font-size="14">SOC ANALYST</text>
  <text x="175" y="130" class="m" font-size="14" fill="#94a3b8">BLUE TEAM</text>
  <rect x="28" y="210" width="330" height="54" rx="12" fill="#070a12"/>
  <text x="45" y="243" class="m" font-size="14">Splunk · Windows · Linux · Python</text>
  <animateTransform attributeName="transform" type="rotate" values="0 195 270;-2 195 270;0 195 270;2 195 270;0 195 270" dur="5s" repeatCount="indefinite"/>
</g>
<g transform="translate(520 120)">
  <rect width="570" height="300" rx="24" fill="#070a12" stroke="#334155"/>
  <text x="28" y="45" class="m" font-size="16" fill="#22d3ee">LIVE SECURITY TELEMETRY</text>
  <g transform="translate(28 75)">
    <rect width="155" height="78" rx="14" fill="#111827"/><text x="18" y="30" class="m" font-size="13">DETECTIONS</text><text x="18" y="60" class="t" font-size="26">T1110</text>
    <rect x="175" width="155" height="78" rx="14" fill="#111827"/><text x="193" y="30" class="m" font-size="13">SIEM</text><text x="193" y="60" class="t" font-size="26">SPLUNK</text>
    <rect x="350" width="155" height="78" rx="14" fill="#111827"/><text x="368" y="30" class="m" font-size="13">STATUS</text><text x="368" y="60" class="t" font-size="26" fill="#22d3ee">READY</text>
  </g>
  <g transform="translate(40 190)">
    <rect x="0" y="60" width="70" height="20" rx="5" fill="#22d3ee"><animate attributeName="height" values="20;75;20" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="100" y="35" width="70" height="45" rx="5" fill="#a78bfa"><animate attributeName="height" values="45;90;45" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="200" y="50" width="70" height="30" rx="5" fill="#f472b6"><animate attributeName="height" values="30;65;30" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="300" y="20" width="70" height="60" rx="5" fill="#22d3ee"><animate attributeName="height" values="60;100;60" dur="2s" repeatCount="indefinite"/></rect>
  </g>
</g>

</svg>