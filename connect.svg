<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <title>Connect with Gaurav</title>
  <defs>
    <linearGradient id="aurora" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151827"/><stop offset="1" stop-color="#0d0e16"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".08"/></pattern>
    <style>
      .bg{fill:#0d0e16} .card{fill:url(#glass);stroke:url(#aurora);stroke-opacity:.55}
      .t{fill:#f8fafc;font-family:Inter,Arial,sans-serif} .m{fill:#cbd5e1;font-family:'JetBrains Mono',Consolas,monospace}
      .cyan{fill:#22d3ee} .muted{fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="520" class="bg"/>
  <rect width="1200" height="520" fill="url(#dots)"/>
  
<rect x="30" y="30" width="1140" height="460" rx="30" class="card"/>
<g transform="translate(70 90)">
  <circle cx="135" cy="105" r="70" fill="#111827" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="135" cy="82" r="25" fill="#334155"/><path d="M88 155 Q135 115 182 155" fill="#334155"/>
  <text x="0" y="220" class="t" font-size="30" font-weight="700">Let's Connect</text>
  <text x="0" y="255" class="m" font-size="16" fill="#94a3b8">Security · SOC · Systems · Cloud</text>
</g>
<g transform="translate(500 95)">
  <rect width="570" height="70" rx="18" fill="#111827" stroke="#22d3ee"/>
  <text x="30" y="44" class="m" font-size="19">✉  gauravghandat23@gmail.com</text>
  <rect y="95" width="570" height="70" rx="18" fill="#111827" stroke="#a78bfa"/>
  <text x="30" y="139" class="m" font-size="19">in  linkedin.com/in/gaurav-ghandat-68a5a22b4</text>
  <rect y="190" width="570" height="70" rx="18" fill="#111827" stroke="#f472b6"/>
  <text x="30" y="234" class="m" font-size="19">⌘  github.com/GauravGhandat-23</text>
  <g transform="translate(500 300)">
    <circle cx="0" cy="0" r="8" fill="#22d3ee"><animate attributeName="r" values="6;12;6" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>
</g>

</svg>