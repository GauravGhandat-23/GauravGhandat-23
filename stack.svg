<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <title>Tech stack</title>
  <defs>
    <linearGradient id="aurora" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151827"/><stop offset="1" stop-color="#0d0e16"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".08"/></pattern>
    <style>
      .bg{fill:#0d0e16} .card{fill:url(#glass);stroke:url(#aurora);stroke-opacity:.55}
      .t{fill:#f8fafc;font-family:Inter,Arial,sans-serif} .m{fill:#cbd5e1;font-family:'JetBrains Mono',Consolas,monospace}
      .cyan{fill:#22d3ee} .muted{fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="520" class="bg"/>
  <rect width="1200" height="520" fill="url(#dots)"/>
  
<rect x="30" y="30" width="1140" height="460" rx="30" class="card"/>
<text x="65" y="82" class="t" font-size="30" font-weight="700">🧰 Tech Arsenal</text>
<circle cx="390" cy="280" r="72" fill="#07111b" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/>
<text x="390" y="275" text-anchor="middle" class="m" font-size="18" fill="#22d3ee">SECURITY</text>
<text x="390" y="300" text-anchor="middle" class="m" font-size="15">CORE</text>
<ellipse cx="390" cy="280" rx="220" ry="105" fill="none" stroke="#22d3ee" opacity=".55"/>
<ellipse cx="390" cy="280" rx="220" ry="105" fill="none" stroke="#a78bfa" opacity=".45" transform="rotate(60 390 280)"/>
<ellipse cx="390" cy="280" rx="220" ry="105" fill="none" stroke="#f472b6" opacity=".4" transform="rotate(-60 390 280)"/>
<g class="m" font-size="17">
<text x="215" y="155" fill="#22d3ee">Splunk</text><text x="555" y="180" fill="#a78bfa">Zeek</text>
<text x="170" y="375" fill="#f472b6">Linux</text><text x="565" y="365" fill="#22d3ee">AWS</text>
<text x="335" y="425" fill="#a78bfa">Python</text>
</g>
<g transform="translate(700 115)">
  <rect width="390" height="290" rx="22" fill="#070a12" stroke="#334155"/>
  <text x="25" y="45" class="m" font-size="17" fill="#22d3ee">SIEM &amp; SOC</text>
  <text x="25" y="82" class="m" font-size="16">Splunk · SPL · MITRE ATT&amp;CK</text>
  <text x="25" y="125" class="m" font-size="17" fill="#a78bfa">WINDOWS</text>
  <text x="25" y="160" class="m" font-size="16">Server · AD · GPO · DNS · DHCP</text>
  <text x="25" y="203" class="m" font-size="17" fill="#f472b6">SECURITY TOOLS</text>
  <text x="25" y="238" class="m" font-size="16">Wireshark · Nmap · Burp · Metasploit</text>
  <text x="25" y="278" class="m" font-size="16">Python · PowerShell · Bash · SQL</text>
</g>

</svg>