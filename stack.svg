<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="Cybersecurity &amp; SOC Tech Stack">
<title>Cybersecurity Tech Arsenal</title>
<desc>Left: Orbiting cybersecurity technologies centered on SOC Analyst core. Right: Categorized technology groups.</desc>
<defs>
<style>
text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.sg{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;font-weight:700}
.sgm{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;font-weight:500}
.jb{font-family:'JetBrains Mono',Consolas,monospace}
.jbb{font-family:'JetBrains Mono',Consolas,monospace;font-weight:700}
@keyframes orbitSpin1{from{transform:rotate(0deg)}}to{transform:rotate(360deg)}}
@keyframes orbitSpin2{from{transform:rotate(360deg)}}to{transform:rotate(0deg)}}
@keyframes orbitSpin3{from{transform:rotate(0deg)}}to{transform:rotate(360deg)}}
.orbit1{transform-origin:262px 290px;animation:orbitSpin1 22s linear infinite}
.orbit2{transform-origin:262px 290px;animation:orbitSpin2 32s linear infinite}
.orbit3{transform-origin:262px 290px;animation:orbitSpin3 44s linear infinite}
.counter-spin1{transform-box:fill-box;transform-origin:center;animation:orbitSpin2 22s linear infinite}
.counter-spin2{transform-box:fill-box;transform-origin:center;animation:orbitSpin1 32s linear infinite}
.counter-spin3{transform-box:fill-box;transform-origin:center;animation:orbitSpin2 44s linear infinite}
@keyframes pulseCenter{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.center-node{transform-origin:262px 290px;animation:pulseCenter 3s ease-in-out infinite}
</style>
<linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c101d"/><stop offset="1" stop-color="#070a12"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00e5ff" stop-opacity=".45"/><stop offset=".5" stop-color="#1e293b"/><stop offset="1" stop-color="#34d399" stop-opacity=".45"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r=".8" fill="#fff" fill-opacity=".05"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1280" height="480" rx="24" fill="url(#cardbg)"/>
<rect width="1280" height="480" rx="24" fill="url(#dots)"/>
<rect x=".75" y=".75" width="1278.5" height="478.5" rx="23.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

<!-- Title -->
<text class="jbb" x="40" y="54" font-size="12.5" fill="#00e5ff" letter-spacing="2.2">// TECH ARSENAL</text>
<text class="sg" x="40" y="94" font-size="28" fill="#eceef6" letter-spacing="-.5">Technologies &amp; Defensive Tooling</text>

<!-- ================= LEFT: ORBITING TECH SYSTEM ================= -->
<g transform="translate(0, 0)">
  <!-- Orbit Circles -->
  <circle cx="262" cy="290" r="76" fill="none" stroke="#161f36" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="262" cy="290" r="135" fill="none" stroke="#161f36" stroke-width="1.2" stroke-dasharray="6 6"/>
  <circle cx="262" cy="290" r="195" fill="none" stroke="#161f36" stroke-width="1.2" stroke-dasharray="4 6"/>

  <!-- Inner Orbit (r=76) -->
  <g class="orbit1">
    <!-- Node 1: Splunk -->
    <g transform="translate(338, 290)">
      <circle r="19" fill="#0c101d" stroke="#00e5ff" stroke-width="1.5"/>
      <text class="counter-spin1" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="bold" fill="#00e5ff">SPL</text>
    </g>
    <!-- Node 2: SIEM -->
    <g transform="translate(186, 290)">
      <circle r="19" fill="#0c101d" stroke="#34d399" stroke-width="1.5"/>
      <text class="counter-spin1" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="bold" fill="#34d399">SIEM</text>
    </g>
    <!-- Node 3: MITRE -->
    <g transform="translate(262, 214)">
      <circle r="19" fill="#0c101d" stroke="#f472b6" stroke-width="1.5"/>
      <text class="counter-spin1" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="bold" fill="#f472b6">ATT&amp;CK</text>
    </g>
  </g>

  <!-- Middle Orbit (r=135) -->
  <g class="orbit2">
    <!-- Node 1: AD -->
    <g transform="translate(397, 290)">
      <circle r="21" fill="#0c101d" stroke="#38bdf8" stroke-width="1.5"/>
      <text class="counter-spin2" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="bold" fill="#38bdf8">AD</text>
    </g>
    <!-- Node 2: Win Server -->
    <g transform="translate(127, 290)">
      <circle r="21" fill="#0c101d" stroke="#38bdf8" stroke-width="1.5"/>
      <text class="counter-spin2" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="bold" fill="#38bdf8">WIN</text>
    </g>
    <!-- Node 3: Linux -->
    <g transform="translate(262, 155)">
      <circle r="21" fill="#0c101d" stroke="#fde047" stroke-width="1.5"/>
      <text class="counter-spin2" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="bold" fill="#fde047">LINUX</text>
    </g>
    <!-- Node 4: Wireshark -->
    <g transform="translate(262, 425)">
      <circle r="21" fill="#0c101d" stroke="#a78bfa" stroke-width="1.5"/>
      <text class="counter-spin2" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="bold" fill="#a78bfa">ZEEK</text>
    </g>
  </g>

  <!-- Outer Orbit (r=195) -->
  <g class="orbit3">
    <!-- Node 1: Python -->
    <g transform="translate(457, 290)">
      <circle r="22" fill="#0c101d" stroke="#38bdf8" stroke-width="1.5"/>
      <text class="counter-spin3" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="bold" fill="#38bdf8">PYTHON</text>
    </g>
    <!-- Node 2: PowerShell -->
    <g transform="translate(67, 290)">
      <circle r="22" fill="#0c101d" stroke="#34d399" stroke-width="1.5"/>
      <text class="counter-spin3" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="bold" fill="#34d399">PSHELL</text>
    </g>
    <!-- Node 3: Nmap -->
    <g transform="translate(262, 95)">
      <circle r="22" fill="#0c101d" stroke="#f472b6" stroke-width="1.5"/>
      <text class="counter-spin3" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="bold" fill="#f472b6">NMAP</text>
    </g>
    <!-- Node 4: AWS & OCI -->
    <g transform="translate(262, 485)">
      <circle r="22" fill="#0c101d" stroke="#fde047" stroke-width="1.5"/>
      <text class="counter-spin3" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="bold" fill="#fde047">CLOUD</text>
    </g>
  </g>

  <!-- Center Core Node -->
  <g class="center-node">
    <circle cx="262" cy="290" r="42" fill="#12182c" stroke="#00e5ff" stroke-width="2.5" filter="url(#glow)"/>
    <text x="262" y="280" font-size="12" font-weight="900" fill="#00e5ff" text-anchor="middle">SOC</text>
    <text x="262" y="295" font-size="10.5" font-weight="bold" fill="#eceef6" text-anchor="middle">ANALYST</text>
    <text x="262" y="308" font-size="8.5" font-weight="bold" fill="#34d399" text-anchor="middle">BLUE TEAM</text>
  </g>
</g>

<!-- ================= RIGHT: SKILL CATEGORIES ================= -->
<g transform="translate(560, 110)">
  <!-- Category 1: SIEM & Threat Detection -->
  <text class="jbb" x="14" y="23" font-size="11.5" fill="#00e5ff" letter-spacing="2">SIEM &amp; THREAT DETECTION</text>
  <g transform="translate(14, 35)">
    <rect x="0" y="0" width="138" height="30" rx="8" fill="#12182c" stroke="#00e5ff" stroke-width="1"/>
    <text class="jb" x="69" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Splunk Enterprise</text>

    <rect x="148" y="0" width="112" height="30" rx="8" fill="#12182c" stroke="#00e5ff" stroke-width="1"/>
    <text class="jb" x="204" y="19" font-size="12" fill="#eceef6" text-anchor="middle">SPL Queries</text>

    <rect x="270" y="0" width="76" height="30" rx="8" fill="#12182c" stroke="#34d399" stroke-width="1"/>
    <text class="jb" x="308" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Zeek</text>

    <rect x="356" y="0" width="134" height="30" rx="8" fill="#12182c" stroke="#f472b6" stroke-width="1"/>
    <text class="jb" x="423" y="19" font-size="12" fill="#eceef6" text-anchor="middle">MITRE ATT&amp;CK</text>

    <rect x="500" y="0" width="138" height="30" rx="8" fill="#12182c" stroke="#38bdf8" stroke-width="1"/>
    <text class="jb" x="569" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Alert Triage</text>
  </g>

  <!-- Category 2: Infrastructure & Active Directory -->
  <text class="jbb" x="14" y="105" font-size="11.5" fill="#38bdf8" letter-spacing="2">INFRASTRUCTURE &amp; ACTIVE DIRECTORY</text>
  <g transform="translate(14, 117)">
    <rect x="0" y="0" width="168" height="30" rx="8" fill="#12182c" stroke="#38bdf8" stroke-width="1"/>
    <text class="jb" x="84" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Windows Server 2025</text>

    <rect x="178" y="0" width="146" height="30" rx="8" fill="#12182c" stroke="#38bdf8" stroke-width="1"/>
    <text class="jb" x="251" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Active Directory</text>

    <rect x="334" y="0" width="128" height="30" rx="8" fill="#12182c" stroke="#a78bfa" stroke-width="1"/>
    <text class="jb" x="398" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Group Policy</text>

    <rect x="472" y="0" width="98" height="30" rx="8" fill="#12182c" stroke="#fde047" stroke-width="1"/>
    <text class="jb" x="521" y="19" font-size="12" fill="#eceef6" text-anchor="middle">RHEL Linux</text>

    <rect x="580" y="0" width="88" height="30" rx="8" fill="#12182c" stroke="#34d399" stroke-width="1"/>
    <text class="jb" x="624" y="19" font-size="12" fill="#eceef6" text-anchor="middle">DNS/DHCP</text>
  </g>

  <!-- Category 3: Security Tools & Network -->
  <text class="jbb" x="14" y="187" font-size="11.5" fill="#f472b6" letter-spacing="2">SECURITY TOOLING &amp; NETWORK</text>
  <g transform="translate(14, 199)">
    <rect x="0" y="0" width="102" height="30" rx="8" fill="#12182c" stroke="#f472b6" stroke-width="1"/>
    <text class="jb" x="51" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Wireshark</text>

    <rect x="112" y="0" width="76" height="30" rx="8" fill="#12182c" stroke="#fde047" stroke-width="1"/>
    <text class="jb" x="150" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Nmap</text>

    <rect x="198" y="0" width="108" height="30" rx="8" fill="#12182c" stroke="#a78bfa" stroke-width="1"/>
    <text class="jb" x="252" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Burp Suite</text>

    <rect x="316" y="0" width="112" height="30" rx="8" fill="#12182c" stroke="#ef4444" stroke-width="1"/>
    <text class="jb" x="372" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Metasploit</text>

    <rect x="438" y="0" width="118" height="30" rx="8" fill="#12182c" stroke="#00e5ff" stroke-width="1"/>
    <text class="jb" x="497" y="19" font-size="12" fill="#eceef6" text-anchor="middle">GuardDuty</text>

    <rect x="566" y="0" width="82" height="30" rx="8" fill="#12182c" stroke="#34d399" stroke-width="1"/>
    <text class="jb" x="607" y="19" font-size="12" fill="#eceef6" text-anchor="middle">TCP/IP</text>
  </g>

  <!-- Category 4: Scripting, Data & Cloud -->
  <text class="jbb" x="14" y="269" font-size="11.5" fill="#34d399" letter-spacing="2">SCRIPTING, DATA &amp; CLOUD</text>
  <g transform="translate(14, 281)">
    <rect x="0" y="0" width="86" height="30" rx="8" fill="#12182c" stroke="#38bdf8" stroke-width="1"/>
    <text class="jb" x="43" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Python</text>

    <rect x="96" y="0" width="112" height="30" rx="8" fill="#12182c" stroke="#34d399" stroke-width="1"/>
    <text class="jb" x="152" y="19" font-size="12" fill="#eceef6" text-anchor="middle">PowerShell</text>

    <rect x="218" y="0" width="76" height="30" rx="8" fill="#12182c" stroke="#fde047" stroke-width="1"/>
    <text class="jb" x="256" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Bash</text>

    <rect x="304" y="0" width="68" height="30" rx="8" fill="#12182c" stroke="#a78bfa" stroke-width="1"/>
    <text class="jb" x="338" y="19" font-size="12" fill="#eceef6" text-anchor="middle">SQL</text>

    <rect x="382" y="0" width="94" height="30" rx="8" fill="#12182c" stroke="#f59e0b" stroke-width="1"/>
    <text class="jb" x="429" y="19" font-size="12" fill="#eceef6" text-anchor="middle">AWS Cloud</text>

    <rect x="486" y="0" width="94" height="30" rx="8" fill="#12182c" stroke="#ef4444" stroke-width="1"/>
    <text class="jb" x="533" y="19" font-size="12" fill="#eceef6" text-anchor="middle">Oracle OCI</text>
  </g>
</g>

</svg>