<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="Cybersecurity Operations Dashboard">
<title>Cybersecurity / Security Operations Dashboard</title>
<desc>Futuristic SOC dashboard displaying illustrative events, alerts, detection coverage, throughput waveform, and live security telemetry logs.</desc>
<defs>
<style>
text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.sg{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;font-weight:700}
.sgm{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;font-weight:500}
.jb{font-family:'JetBrains Mono',Consolas,monospace}
.jbb{font-family:'JetBrains Mono',Consolas,monospace;font-weight:700}
@keyframes pulseGlow{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulseGlow 2.5s ease-in-out infinite}
@keyframes waveFlow{0%{transform:translateX(0)}100%{transform:translateX(-140px)}}
.wave-move{animation:waveFlow 6s linear infinite}
@keyframes scanline{0%{transform:translateY(0)}50%{transform:translateY(160px)}100%{transform:translateY(0)}}
.scanner{animation:scanline 4s ease-in-out infinite}
</style>
<linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee" stop-opacity=".1"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#22d3ee" stop-opacity=".1"/></linearGradient>
<pattern id="dotP" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r=".7" fill="#fff" fill-opacity=".04"/></pattern>
<clipPath id="waveClip"><rect x="0" y="0" width="370" height="150" rx="10"/></clipPath>
</defs>

<!-- Main Outer Shell -->
<rect width="1280" height="480" rx="18" fill="#0d1117"/>
<rect width="1280" height="480" rx="18" fill="url(#dotP)"/>
<rect x=".75" y=".75" width="1278.5" height="478.5" rx="17.25" fill="none" stroke="#30363d" stroke-width="1.5"/>

<!-- Top Titlebar -->
<g transform="translate(32, 28)">
  <rect x="0" y="0" width="1216" height="46" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="23" r="5" fill="#f85149"/><circle cx="36" cy="23" r="5" fill="#d29922"/><circle cx="52" cy="23" r="5" fill="#3fb950"/>
  <text class="jbb" x="76" y="27" font-size="11.5" fill="#58a6ff" letter-spacing="1.5">CYBERSECURITY // SECURITY OPERATIONS COMMAND</text>
  
  <rect x="740" y="10" width="460" height="26" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <circle class="pulse" cx="754" cy="23" r="4" fill="#3fb950"/>
  <text class="jb" x="768" y="27" font-size="10" fill="#8b949e">STATUS: <tspan fill="#3fb950" font-weight="bold">ACTIVE LAB DEFENSE</tspan> · METRICS: <tspan fill="#d29922">ILLUSTRATIVE</tspan></text>
</g>

<!-- ================= 4 METRIC COUNTERS ROW ================= -->
<g transform="translate(32, 90)">

  <!-- Counter 1: EVENTS 5000+ -->
  <g transform="translate(0, 0)">
    <rect width="288" height="106" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text class="jbb" x="20" y="30" font-size="11" fill="#8b949e" letter-spacing="1.2">EVENTS ANALYZED</text>
    <text class="jbb" x="20" y="68" font-size="34" fill="#3fb950">5,000+</text>
    <circle cx="258" cy="30" r="14" fill="#3fb950" fill-opacity=".15"/>
    <text x="258" y="35" font-size="12" text-anchor="middle">📊</text>
    <text class="jb" x="20" y="92" font-size="10" fill="#6e7681">Linux Auth · Zeek JSON · Sysmon</text>
  </g>

  <!-- Counter 2: ALERTS 50 -->
  <g transform="translate(310, 0)">
    <rect width="288" height="106" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text class="jbb" x="20" y="30" font-size="11" fill="#8b949e" letter-spacing="1.2">ACTIVE ALERTS</text>
    <text class="jbb" x="20" y="68" font-size="34" fill="#d29922">50</text>
    <circle cx="258" cy="30" r="14" fill="#d29922" fill-opacity=".15"/>
    <text x="258" y="35" font-size="12" text-anchor="middle">⚠️</text>
    <text class="jb" x="20" y="92" font-size="10" fill="#6e7681">Triaged · Correlated · Scored</text>
  </g>

  <!-- Counter 3: DETECTIONS 23 -->
  <g transform="translate(620, 0)">
    <rect width="288" height="106" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text class="jbb" x="20" y="30" font-size="11" fill="#8b949e" letter-spacing="1.2">DETECTIONS ENGINEERED</text>
    <text class="jbb" x="20" y="68" font-size="34" fill="#22d3ee">23</text>
    <circle cx="258" cy="30" r="14" fill="#22d3ee" fill-opacity=".15"/>
    <text x="258" y="35" font-size="12" text-anchor="middle">🎯</text>
    <text class="jb" x="20" y="92" font-size="10" fill="#6e7681">MITRE ATT&amp;CK Mapped Rules</text>
  </g>

  <!-- Counter 4: THREATS 7 -->
  <g transform="translate(930, 0)">
    <rect width="286" height="106" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text class="jbb" x="20" y="30" font-size="11" fill="#8b949e" letter-spacing="1.2">THREATS NEUTRALIZED</text>
    <text class="jbb" x="20" y="68" font-size="34" fill="#f85149">7</text>
    <circle cx="256" cy="30" r="14" fill="#f85149" fill-opacity=".15"/>
    <text x="256" y="35" font-size="12" text-anchor="middle">🛡️</text>
    <text class="jb" x="20" y="92" font-size="10" fill="#6e7681">Isolated · Contained · Post-Mortem</text>
  </g>
</g>

<!-- ================= LOWER 3 COLUMNS ================= -->
<g transform="translate(32, 214)">

  <!-- PANEL 1: SEVERITY BREAKDOWN & DETECTION HEALTH (Width: 380) -->
  <g transform="translate(0, 0)">
    <rect width="380" height="236" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text class="jbb" x="20" y="28" font-size="11" fill="#58a6ff" letter-spacing="1.2">SEVERITY DISTRIBUTION &amp; HEALTH</text>
    
    <!-- Circular gauge (cx=65, cy=105, r=36) -->
    <g transform="translate(20, 48)">
      <circle cx="48" cy="52" r="38" fill="none" stroke="#21262d" stroke-width="8"/>
      <circle cx="48" cy="52" r="38" fill="none" stroke="#3fb950" stroke-width="8" stroke-dasharray="238" stroke-dashoffset="12" transform="rotate(-90 48 52)"/>
      <text class="jbb" x="48" y="52" font-size="14" fill="#f0f6fc" text-anchor="middle" dominant-baseline="middle">99.2%</text>
      <text class="jb" x="48" y="104" font-size="9" fill="#8b949e" text-anchor="middle">COVERAGE UPTIME</text>
    </g>

    <!-- Progress Bars -->
    <g transform="translate(136, 44)">
      <!-- Critical -->
      <text class="jb" x="0" y="12" font-size="10" fill="#f85149">CRITICAL (7)</text>
      <rect x="0" y="18" width="224" height="6" rx="3" fill="#21262d"/>
      <rect x="0" y="18" width="56" height="6" rx="3" fill="#f85149"/>

      <!-- High -->
      <text class="jb" x="0" y="44" font-size="10" fill="#fb8532">HIGH (16)</text>
      <rect x="0" y="50" width="224" height="6" rx="3" fill="#21262d"/>
      <rect x="0" y="50" width="112" height="6" rx="3" fill="#fb8532"/>

      <!-- Medium -->
      <text class="jb" x="0" y="76" font-size="10" fill="#d29922">MEDIUM (27)</text>
      <rect x="0" y="82" width="224" height="6" rx="3" fill="#21262d"/>
      <rect x="0" y="82" width="168" height="6" rx="3" fill="#d29922"/>

      <!-- Low / Info -->
      <text class="jb" x="0" y="108" font-size="10" fill="#3fb950">LOW / AUDIT (120)</text>
      <rect x="0" y="114" width="224" height="6" rx="3" fill="#21262d"/>
      <rect x="0" y="114" width="210" height="6" rx="3" fill="#3fb950"/>
    </g>

    <line x1="20" y1="188" x2="360" y2="188" stroke="#30363d" stroke-width="1"/>
    <text class="jb" x="20" y="212" font-size="10" fill="#8b949e">Defense Profile: <tspan fill="#34d399">Enterprise SOC v2.0</tspan> · Region: <tspan fill="#22d3ee">India</tspan></text>
  </g>

  <!-- PANEL 2: TELEMETRY THROUGHPUT & EPS WAVEFORM (Width: 400) -->
  <g transform="translate(400, 0)">
    <rect width="400" height="236" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text class="jbb" x="20" y="28" font-size="11" fill="#58a6ff" letter-spacing="1.2">REAL-TIME INGESTION (EPS WAVEFORM)</text>
    <text class="jb" x="380" y="28" font-size="9.5" fill="#3fb950" text-anchor="end">PEAK: 480 EPS</text>

    <!-- Waveform Area -->
    <g transform="translate(16, 44)" clip-path="url(#waveClip)">
      <rect width="368" height="136" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
      
      <!-- Grid lines -->
      <line x1="0" y1="34" x2="368" y2="34" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="68" x2="368" y2="68" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="102" x2="368" y2="102" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Animated Waves -->
      <g class="wave-move">
        <path d="M0 80 Q 35 20, 70 80 T 140 80 T 210 80 T 280 80 T 350 80 T 420 80 T 490 80 T 560 80" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity=".85"/>
        <path d="M0 80 Q 35 45, 70 80 T 140 80 T 210 80 T 280 80 T 350 80 T 420 80 T 490 80 T 560 80" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity=".55"/>
      </g>
      
      <!-- Scan line -->
      <line class="scanner" x1="0" y1="0" x2="368" y2="0" stroke="#22d3ee" stroke-width="1.5" stroke-opacity=".7"/>
    </g>

    <text class="jb" x="20" y="210" font-size="9.5" fill="#8b949e">Avg Rate: <tspan fill="#f0f6fc">320 EPS</tspan> · Protocol: <tspan fill="#22d3ee">Splunk Forwarder 9997</tspan></text>
  </g>

  <!-- PANEL 3: LIVE TERMINAL LOG FEED (Width: 396) -->
  <g transform="translate(820, 0)">
    <rect width="396" height="236" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text class="jbb" x="20" y="28" font-size="11" fill="#58a6ff" letter-spacing="1.2">SECURITY TELEMETRY LOGS</text>
    <circle cx="376" cy="24" r="4" fill="#3fb950"/>

    <g transform="translate(16, 42)">
      <rect width="364" height="174" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
      
      <text class="jb" x="12" y="24" font-size="9.5" fill="#8b949e">14:02:11 <tspan fill="#22d3ee">[ZEEK-DNS]</tspan> T1071.004 anomaly</text>
      <text class="jb" x="12" y="44" font-size="9.5" fill="#8b949e">14:02:19 <tspan fill="#f85149">[SPLUNK]</tspan> SSH Brute-Force spike</text>
      <text class="jb" x="12" y="64" font-size="9.5" fill="#8b949e">14:02:44 <tspan fill="#d29922">[WIN-4625]</tspan> Multiple auth fails</text>
      <text class="jb" x="12" y="84" font-size="9.5" fill="#8b949e">14:03:02 <tspan fill="#34d399">[WAF-HTTP]</tspan> SQLi traversal blocked</text>
      <text class="jb" x="12" y="104" font-size="9.5" fill="#8b949e">14:03:15 <tspan fill="#a78bfa">[RESPONSE]</tspan> Host isolation initiated</text>
      <text class="jb" x="12" y="124" font-size="9.5" fill="#8b949e">14:03:32 <tspan fill="#3fb950">[FW-RULE]</tspan> Source IP quarantined</text>
      <text class="jb" x="12" y="144" font-size="9.5" fill="#22d3ee">14:03:50 <tspan fill="#58a6ff">[SOC-HUD]</tspan> Incident closed - clean</text>
      
      <circle cx="16" cy="158" r="3" fill="#3fb950" class="pulse"/>
      <text class="jbb" x="26" y="161" font-size="9" fill="#3fb950">LISTENING FOR EVENT STREAMS...</text>
    </g>
  </g>
</g>

</svg>